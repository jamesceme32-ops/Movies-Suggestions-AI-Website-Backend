<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}JZ's Movie Suggester{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=Share+Tech+Mono&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Variables ─────────────────────────────────────────── */
    :root {
      --space-black:  #03050f;
      --deep-navy:    #070d1f;
      --nebula-blue:  #0d1f3c;
      --star-white:   #e8eef8;
      --dim-white:    #6b7a99;
      --gold:         #f0c040;
      --gold-dim:     #a07820;
      --cyan:         #40c8f0;
      --cyan-dim:     #1a5a70;
      --red-giant:    #e05050;
      --panel:        rgba(13,31,60,0.7);
      --panel-border: rgba(64,200,240,0.15);
      --glow-gold:    0 0 20px rgba(240,192,64,0.3);
      --glow-cyan:    0 0 20px rgba(64,200,240,0.3);
    }

    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Stars background ──────────────────────────────────── */
    body {
      background-color: var(--space-black);
      color: var(--star-white);
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Layered star fields */
    body::before, body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 23% 44%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 37% 8%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 52% 31%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 68% 19%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 79% 55%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 7%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 94% 42%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 5% 72%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 17% 88%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 44% 67%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 61% 79%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 73% 93%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 85% 82%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 31% 95%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 56% 52%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(2px 2px at 91% 28%, rgba(200,220,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 3%  38%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 48% 83%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 77% 67%, rgba(255,240,200,0.5) 0%, transparent 100%);
    }
    body::after {
      /* Nebula glow blobs */
      background:
        radial-gradient(ellipse 60% 40% at 20% 30%, rgba(30,60,120,0.25) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 70%, rgba(60,20,80,0.2) 0%, transparent 70%),
        radial-gradient(ellipse 70% 30% at 50% 90%, rgba(20,80,100,0.15) 0%, transparent 70%);
    }

    /* ── Layout ────────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    /* ── Nav ───────────────────────────────────────────────── */
    nav {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--panel-border);
      backdrop-filter: blur(10px);
      background: rgba(3,5,15,0.5);
    }
    .nav-brand {
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: var(--gold);
      text-decoration: none;
      text-shadow: var(--glow-gold);
    }
    .nav-brand span { color: var(--cyan); }
    nav a.nav-link {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: var(--dim-white);
      text-decoration: none;
      letter-spacing: 0.1em;
      transition: color 0.2s;
    }
    nav a.nav-link:hover { color: var(--cyan); }

    /* ── Panel ─────────────────────────────────────────────── */
    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      padding: 28px 32px;
      margin-bottom: 24px;
    }
    .panel-title {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--cyan);
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--cyan-dim), transparent);
    }

    /* ── Buttons ───────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      font-family: 'Orbitron', monospace;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--gold), #c89020);
      color: #000;
      box-shadow: var(--glow-gold);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(240,192,64,0.5);
    }
    .btn-secondary {
      background: transparent;
      color: var(--cyan);
      border: 1px solid var(--cyan-dim);
    }
    .btn-secondary:hover {
      background: rgba(64,200,240,0.1);
      border-color: var(--cyan);
    }
    .btn-sm { padding: 6px 14px; font-size: 0.65rem; }

    /* ── Form elements ─────────────────────────────────────── */
    .form-label {
      display: block;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.72rem;
      color: var(--dim-white);
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    input[type="text"],
    select {
      width: 100%;
      background: rgba(7,13,31,0.8);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: var(--star-white);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      padding: 9px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus,
    select:focus { border-color: var(--cyan); }
    select option { background: var(--deep-navy); }

    /* Multi-select listbox */
    select[multiple] {
      padding: 4px;
      height: auto;
    }
    select[multiple] option {
      padding: 5px 10px;
      border-radius: 4px;
      margin: 1px 0;
    }
    select[multiple] option:checked {
      background: linear-gradient(135deg, var(--cyan-dim), var(--nebula-blue));
      color: var(--cyan);
    }

    /* ── Stats row ─────────────────────────────────────────── */
    .stats-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .stat-chip {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: var(--dim-white);
      background: rgba(13,31,60,0.5);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 4px 14px;
    }
    .stat-chip strong { color: var(--gold); }

    /* ── Profile bar ───────────────────────────────────────── */
    .profile-bar {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: var(--dim-white);
      line-height: 1.8;
    }
    .profile-bar span { color: var(--cyan); }

    /* ── Results table ─────────────────────────────────────── */
    .results-count {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: var(--dim-white);
      margin-bottom: 12px;
    }
    .results-count strong { color: var(--gold); }

    .table-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    thead th {
      background: rgba(13,31,60,0.9);
      color: var(--cyan);
      font-family: 'Orbitron', monospace;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      padding: 12px 14px;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1px solid var(--panel-border);
      cursor: pointer;
      user-select: none;
    }
    thead th:hover { color: var(--gold); }
    tbody tr {
      border-bottom: 1px solid rgba(64,200,240,0.06);
      transition: background 0.15s;
    }
    tbody tr:hover { background: rgba(64,200,240,0.05); }
    tbody td {
      padding: 10px 14px;
      color: var(--star-white);
      vertical-align: middle;
      white-space: nowrap;
    }
    td.title-cell {
      white-space: normal;
      max-width: 200px;
      font-weight: 500;
    }
    td .links {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    td .links a {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: var(--cyan-dim);
      text-decoration: none;
      border: 1px solid var(--cyan-dim);
      border-radius: 3px;
      padding: 1px 6px;
      transition: all 0.15s;
    }
    td .links a:hover {
      color: var(--cyan);
      border-color: var(--cyan);
    }
    .badge {
      display: inline-block;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      border-radius: 4px;
      padding: 2px 8px;
    }
    .badge-watched {
      background: rgba(64,200,240,0.1);
      color: var(--cyan);
      border: 1px solid var(--cyan-dim);
    }
    .badge-unwatched {
      background: rgba(107,122,153,0.1);
      color: var(--dim-white);
      border: 1px solid rgba(107,122,153,0.3);
    }
    .score-gold { color: var(--gold); font-family: 'Share Tech Mono', monospace; }
    .score-cyan { color: var(--cyan); font-family: 'Share Tech Mono', monospace; }
    .score-dim  { color: var(--dim-white); font-family: 'Share Tech Mono', monospace; }

    /* ── Scrollbar ─────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--space-black); }
    ::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

    /* ── Utility ───────────────────────────────────────────── */
    .mt-16 { margin-top: 16px; }
    .mt-24 { margin-top: 24px; }
    .flex  { display: flex; }
    .gap-12 { gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    @media (max-width: 700px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <a class="nav-brand" href="/">JZ<span>'S</span> MOVIE SUGGESTER</a>
    <a class="nav-link" href="/reset">↩ start over</a>
  </nav>
  <div class="page">
    {% block content %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
